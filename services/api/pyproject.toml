[project]
name = "demo-api"
version = "0.1.0"
description = "Small FastAPI backend for the TanStack Start demo"
requires-python = ">=3.13,<3.15"
dependencies = [
    "ag-ui-protocol==1.0.0",
    "alembic==1.20.0",
    "fastapi==0.143.3",
    "psycopg[binary]==3.3.6",
    "pydantic==2.14.1",
    "sqlalchemy==2.1.5",
    "uvicorn[standard]==0.54.0",
]

[project.scripts]
seed-demo = "demo_api.seed:main"
export-openapi = "demo_api.export_openapi:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/demo_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==9.1.1",
    "ruff==0.17.1",
]
